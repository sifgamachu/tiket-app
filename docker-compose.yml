services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiket
      POSTGRES_PASSWORD: tiket
      POSTGRES_DB: tiket
    ports:
      - "5432:5432"
    volumes:
      - tiket_pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tiket_pgdata:
